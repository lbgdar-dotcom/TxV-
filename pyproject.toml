[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "txv"
version = "0.1.0"
description = "Design and QC of IVT mRNA constructs for multi-antigen cancer vaccines, with Benchling registration"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
benchling = ["benchling-sdk>=1.15"]
# In-silico validation. Kept optional so the design library itself stays
# dependency-free: scripts/validate_in_silico.py needs it, txv.pvax1_ag does
# not, and the 5'-codon choices it informs are pinned constants.
insilico = ["ViennaRNA>=2.6"]
dev = ["pytest>=7.4", "ViennaRNA>=2.6"]

[project.scripts]
txv = "txv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
